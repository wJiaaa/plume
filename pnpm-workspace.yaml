packages:
  - apps/*
  # 共享类型，所有组的底层，单独一层。
  - packages/contract
  - packages/*/*

# pnpm 默认不跑依赖的安装脚本；Electron 要靠它下载二进制，esbuild 要靠它装平台包。
onlyBuiltDependencies:
  - electron
  - esbuild

# koffi 的安装脚本是在没有预编译包时现编，它自带各平台的预编译包，用不上。
# ssh2（SSH 插件）的安装脚本现编可选的加密加速和 cpu-features，不编时用自带的纯 JS 实现，打包机不需要 C++ 工具链。
ignoredBuiltDependencies:
  - koffi
  - ssh2
  - cpu-features

# 可选依赖装哪些平台的，而不只是本机的。
#
# 预编译的原生模块一个平台一个包（esbuild、TypeScript 的原生 tsc、koffi），pnpm 默认只装这台机器要的那一份。
# 打包一次打两个架构（mac 是 arm64 + x64，Windows 是 x64 + arm64），打包的机器只是其中一个：不装别的那份，
# 插件 SDK 和沙箱插件就只能带上本机的，另一个架构的安装包里装着跑不起来的二进制。所以 macOS、Windows 两个平台、
# 两个架构都装；`current` 留着，这几种组合以外的机器照样装上自己要的。打包后 apps/desktop/scripts/check-native-arch.mjs
# 核对每个包里的二进制确实是它的架构。改了这里要删掉 node_modules 重装才生效。
supportedArchitectures:
  os:
    - current
    - darwin
    - win32
  cpu:
    - current
    - x64
    - arm64
