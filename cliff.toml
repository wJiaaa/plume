# CHANGELOG 怎么生成（git-cliff，由 `pnpm release` 调用），省得手写提交列表。
#
# 提交信息的 type 决定一条进不进、进哪一组（格式见 spec/tech/commits.md）。`chore`、`ci`、`build`、`test` 不进：
# 它们是真的，但不是用的人关心的事。
#
# 生成的是原料：发出去的文案是手写的中英两段（`<!-- plume:notes en -->`、`<!-- plume:notes zh-CN -->`），
# 关于页和更新对话框按界面语言只显示其中一段（apps/desktop/src/renderer/update/notes-locale.ts）。
# 发布仓库定下来以后，版本标题和提交号可以加上指向它的链接。

[changelog]
header = """
# 更新日志

这个文件由 `pnpm release` 生成，条目来自提交信息。写得含糊的提交在这里也含糊，所以值得在提交时就写清楚。

"""
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | split(pat="\n") | first | trim }} (`{{ commit.id | truncate(length=7, end="") }}`)
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# 不符合格式的提交不进：勉强解析出来的条目比没有更误导。
filter_unconventional = true
commit_parsers = [
	{ message = "^feat", group = "<!-- 0 -->新功能" },
	{ message = "^fix", group = "<!-- 1 -->修复" },
	{ message = "^perf", group = "<!-- 2 -->性能" },
	{ message = "^refactor", group = "<!-- 3 -->重构" },
	{ message = "^docs", group = "<!-- 4 -->文档" },
	{ message = "^revert", group = "<!-- 1 -->修复" },
	# 发版提交本身不是内容。
	{ message = "^chore\\(release\\)", skip = true },
	{ message = "^(chore|ci|build|test|merge)", skip = true },
]
tag_pattern = "v[0-9].*"
sort_commits = "newest"
